name: Build and Publish Jenkins Agent Image

on:
  push:
    paths:
      - 'docker/jenkins-agent/**'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_uri: ${{ steps.image-info.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        id: ensure-ecr
        run: |
          REPO_NAME=jenkins-agent
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com
          REPOSITORY_URI="${ECR_REGISTRY}/${REPO_NAME}"
          echo "Checking for ECR repository $REPO_NAME..."
          if aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ECR repository $REPO_NAME already exists"
          else
            echo "ECR repository $REPO_NAME not found — creating..."
            aws ecr create-repository --repository-name "$REPO_NAME" --region "$AWS_REGION" || true
          fi

          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
          echo "repository_uri=$REPOSITORY_URI" >> $GITHUB_OUTPUT

      - name: Login to ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin ${{ steps.ensure-ecr.outputs.registry }}

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/jenkins-agent/Dockerfile
          push: true
          tags: |
            ${{ steps.ensure-ecr.outputs.repository_uri }}:latest
            ${{ steps.ensure-ecr.outputs.repository_uri }}:${{ github.sha }}

      - name: Image info
        id: image-info
        run: |
          IMAGE_URI="${{ steps.ensure-ecr.outputs.repository_uri }}:latest"
          echo "ECR image URI: $IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "### ECR image URI\n$IMAGE_URI" >> $GITHUB_STEP_SUMMARY
