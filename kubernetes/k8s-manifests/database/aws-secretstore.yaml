apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: shopnow-ns
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      # Authentication options: prefer IRSA (serviceAccountRef). As a fallback,
      # you can use a Kubernetes secret containing AWS credentials (accessKeyID/secretAccessKey).
      # Example using a Kubernetes secret named `aws-creds` (not included here):
      auth:
        secretRef:
          accessKeyID:
            name: aws-creds
            key: accessKeyID
          secretAccessKey:
            name: aws-creds
            key: secretAccessKey
